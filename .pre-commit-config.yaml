repos:
  - repo: https://github.com/ansible/ansible-lint
    rev: v6.22.1
    hooks:
      - id: ansible-lint
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.33.0
    hooks:
      - id: yamllint
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: fqcn-check
        name: Check for FQCN usage
        entry: bash -c "grep -r -E '^[ \t]*[a-z_]+:[ \t]*$' playbooks/ roles/ | grep -v 'ansible.builtin' && echo 'Found non-FQCN modules!' && exit 1 || exit 0"
        language: system
        files: \.(yml|yaml)$

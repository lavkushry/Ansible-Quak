---
# Pinned Ansible Collections for Enterprise Infrastructure & Automation
# Run: ansible-galaxy collection install -r requirements.yml
collections:
  # Core & Linux POSIX
  - name: ansible.posix
    version: ">=1.5.4"
  - name: community.general
    version: ">=9.0.0"
  - name: community.crypto
    version: ">=2.20.0"

  # ADC & Application Delivery (F5 BIG-IP)
  - name: f5networks.f5_modules
    version: ">=1.29.0"

  # Note: Akamai does not maintain an official Galaxy collection;
  # Akamai EdgeGrid API automation uses ansible.builtin.uri with EdgeGrid signing or Akamai CLI.

  # Zero Trust & Cloud Security (Zscaler ZIA / ZPA)
  - name: zscaler.ziacloud
    version: ">=1.0.0"
  - name: zscaler.zpacloud
    version: ">=1.0.0"

  # Multi-Cloud Services
  - name: amazon.aws
    version: ">=7.4.0"
  - name: azure.azcollection
    version: ">=2.0.0"
  - name: google.cloud
    version: ">=1.3.0"

  # Containers & Databases
  - name: community.docker
    version: ">=3.10.0"
  - name: community.mysql
    version: ">=3.9.0"
  - name: community.postgresql
    version: ">=3.4.0"
